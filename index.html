<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadislar Kutubxonasi</title>
    <!-- Shriftlar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold-btn: #eab308;
            --gold-hover: #ca8a04;
            --btn-dark: #1e293b;
            --accent: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

        /* Header */
        header { background: #0b1329; border-bottom: 1px solid var(--card-border); padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }

        /* Breadcrumb */
        .breadcrumb { max-width: 900px; margin: 15px auto 0; padding: 0 15px; font-size: 14px; color: var(--text-muted); }
        .breadcrumb span { cursor: pointer; }
        .breadcrumb span:hover { color: var(--gold-btn); text-decoration: underline; }

        /* Main */
        main { max-width: 900px; width: 100%; margin: 20px auto; padding: 0 15px; flex: 1; }

        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .page-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }

        /* Search Bar */
        .search-box { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-main); font-size: 16px; outline: none; margin-bottom: 20px; }
        .search-box:focus { border-color: var(--gold-btn); }

        /* Books List */
        .books-list { display: flex; flex-direction: column; gap: 15px; }
        .book-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .book-main-info { display: flex; gap: 20px; align-items: center; }
        
        .book-cover { width: 85px; height: 115px; background: linear-gradient(135deg, #065f46, #022c22); border-radius: 10px; border: 2px solid #059669; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #34d399; text-align: center; padding: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0; }
        .book-cover-title { font-family: 'Amiri', serif; font-size: 14px; color: #e2e8f0; line-height: 1.2; margin-top: 5px; }
        
        .book-details h3 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .book-details .author { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
        .book-details .stats { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        .book-actions { display: flex; gap: 10px; }
        .btn-read { flex: 1; background: var(--gold-btn); color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-read:hover { background: var(--gold-hover); }
        
        .btn-chapters { flex: 1; background: transparent; color: #fff; border: 1px solid var(--card-border); padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-chapters:hover { background: rgba(255,255,255,0.05); border-color: var(--gold-btn); }

        /* Chapters Grid */
        .chapters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
        .chapter-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 15px; cursor: pointer; }
        .chapter-card:hover { border-color: var(--gold-btn); transform: translateY(-2px); }
        .chapter-num { font-size: 12px; color: var(--gold-btn); font-weight: 700; margin-bottom: 4px; }
        .chapter-title { font-size: 14px; font-weight: 600; color: var(--text-main); }

        /* Hadith Card */
        .hadith-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 22px; margin-bottom: 15px; }
        .hadith-meta { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; margin-bottom: 15px; font-size: 13px; font-weight: 600; color: var(--gold-btn); }
        .hadith-ar { font-family: 'Amiri', serif; font-size: 22px; line-height: 2.1; text-align: right; direction: rtl; color: #fff; margin-bottom: 18px; background: rgba(0,0,0,0.15); padding: 12px; border-radius: 8px; }
        .hadith-en { font-size: 15px; line-height: 1.6; color: #cbd5e1; }
        .narrator { font-weight: 700; color: var(--accent); margin-bottom: 6px; }

        .hadith-actions { display: flex; gap: 10px; margin-top: 18px; border-top: 1px dashed var(--card-border); padding-top: 12px; justify-content: flex-end; }
        .action-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #e2e8f0; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .action-btn:hover { border-color: var(--gold-btn); color: var(--gold-btn); }

        /* Helpers */
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 30px; color: var(--text-muted); font-size: 16px; }
        .load-more-btn { display: block; width: 100%; padding: 12px; margin: 20px 0; background: var(--card-bg); color: var(--gold-btn); border: 1px solid var(--gold-btn); border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600; }
        .load-more-btn:hover { background: var(--gold-btn); color: #0f172a; }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo" onclick="goHome()">📚 Hadislar kutubxonasi</div>
    </div>
</header>

<div class="breadcrumb" id="breadcrumb">
    <span onclick="goHome()">Bosh sahifa</span>
</div>

<main>
    <section id="viewBooks">
        <h1 class="page-title">Hadislar kutubxonasi</h1>
        <p class="page-subtitle" id="totalBooksStats">Mavjud sahih va mo'tabar to'plamlar</p>
        <div class="books-list" id="booksList"></div>
    </section>

    <section id="viewChapters" class="hidden">
        <h1 class="page-title" id="chaptersBookTitle">Boblar</h1>
        <p class="page-subtitle">Kerakli bobni tanlang</p>
        <div class="chapters-grid" id="chaptersGrid"></div>
    </section>

    <section id="viewHadiths" class="hidden">
        <input type="text" id="searchInput" class="search-box" placeholder="Hadis matni yoki raqami bo'yicha izlash..." oninput="filterHadiths()">
        <h1 class="page-title" id="selectedBookTitle">Hadislar</h1>
        <p class="page-subtitle" id="totalCount"></p>
        
        <div id="hadithsList"></div>
        <button id="loadMoreBtn" class="load-more-btn hidden" onclick="loadMore()">Ko'proq ko'rsatish</button>
    </section>

    <div id="loading" class="loading hidden">Yuklanmoqda...</div>
</main>

<script>
    const SITE_URL = window.location.origin;

    const books = [
        { id: 1, nameUz: "Sahihul Buxoriy", author: "Imom Buxoriy", file: "db/by_book/the_9_books/bukhari.json", chaptersCount: 98, color: "#065f46" },
        { id: 2, nameUz: "Sahihi Muslim", author: "Imom Muslim", file: "db/by_book/the_9_books/muslim.json", chaptersCount: 57, color: "#1e3a8a" },
        { id: 3, nameUz: "Sunani Abu Dovud", author: "Imom Abu Dovud", file: "db/by_book/the_9_books/abudawud.json", chaptersCount: 43, color: "#78350f" },
        { id: 4, nameUz: "Jomi'u at-Tirmiziy", author: "Imom at-Tirmiziy", file: "db/by_book/the_9_books/tirmidhi.json", chaptersCount: 49, color: "#831843" },
        { id: 5, nameUz: "Sunani an-Nasa'iy", author: "Imom an-Nasa'iy", file: "db/by_book/the_9_books/nasai.json", chaptersCount: 52, color: "#14532d" },
        { id: 6, nameUz: "Sunani Ibn Majah", author: "Imom Ibn Majah", file: "db/by_book/the_9_books/ibnmajah.json", chaptersCount: 37, color: "#581c87" },
        { id: 7, nameUz: "Muvatto Malik", author: "Imom Malik", file: "db/by_book/the_9_books/malik.json", chaptersCount: 61, color: "#701a75" },
        { id: 8, nameUz: "Musnad Ahmad", author: "Imom Ahmad", file: "db/by_book/the_9_books/ahmed.json", chaptersCount: 30, color: "#1e293b" },
        { id: 9, nameUz: "Sunani ad-Darimiy", author: "Imom ad-Darimiy", file: "db/by_book/the_9_books/darimi.json", chaptersCount: 24, color: "#365314" },
        { id: 10, nameUz: "Riyazus Solihin", author: "Imom an-Navaviy", file: "db/by_book/other_books/riyad_assalihin.json", chaptersCount: 20, color: "#0284c7" },
        { id: 11, nameUz: "Al-Arba'in an-Navaviy", author: "Imom an-Navaviy", file: "db/by_book/forties/nawawi40.json", chaptersCount: 1, color: "#d97706" }
    ];

    let currentBook = null;
    let currentHadiths = [];
    let filteredHadiths = [];
    let rawBookData = null;
    let displayedCount = 0;
    const PAGE_SIZE = 30;

    function init() {
        const container = document.getElementById('booksList');
        container.innerHTML = '';
        
        books.forEach(book => {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.innerHTML = `
                <div class="book-main-info">
                    <div class="book-cover" style="background: linear-gradient(135deg, ${book.color}, #090d16)">
                        <span style="font-size:20px;">☪</span>
                        <div class="book-cover-title">${book.nameUz}</div>
                    </div>
                    <div class="book-details">
                        <h3>${book.nameUz}</h3>
                        <div class="author">${book.author}</div>
                        <div class="stats">${book.chaptersCount} bo'lim</div>
                    </div>
                </div>
                <div class="book-actions">
                    <button class="btn-read" onclick="openBook(${book.id}, false)">📖 O'qish</button>
                    <button class="btn-chapters" onclick="openBook(${book.id}, true)">Bo'limlar ➔</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function openBook(bookId, showChaptersOnly = false) {
        currentBook = books.find(b => b.id === bookId);
        showLoading(true);

        try {
            const res = await fetch(currentBook.file);
            if (!res.ok) throw new Error("Faylni yuklab bo'lmadi");
            rawBookData = await res.json();

            const rawHadiths = rawBookData.hadiths || (Array.isArray(rawBookData) ? rawBookData : Object.values(rawBookData));
            currentHadiths = rawHadiths.map((item, index) => ({
                ...item,
                bookHadithNo: item.idInBook || (index + 1)
            }));

            if (showChaptersOnly) {
                renderChaptersView();
            } else {
                showAllHadithsOfBook();
            }
        } catch (err) {
            alert("Xatolik: Fayl yuklanmadi!");
        } finally {
            showLoading(false);
        }
    }

    function renderChaptersView() {
        document.getElementById('chaptersBookTitle').innerText = currentBook.nameUz + " — Boblar";
        const container = document.getElementById('chaptersGrid');
        container.innerHTML = '';

        let chaptersList = rawBookData.chapters || [];

        if (chaptersList.length === 0) {
            const chapterIds = [...new Set(currentHadiths.map(h => h.chapterId))].sort((a,b) => a - b);
            chaptersList = chapterIds.map(id => ({ id: id, english: `Bob #${id}` }));
        }

        chaptersList.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'chapter-card';
            card.onclick = () => filterHadithsByChapter(ch.id);
            card.innerHTML = `
                <div class="chapter-num">Bob ${ch.id}</div>
                <div class="chapter-title">${ch.english?.title || ch.english || ch.arabic || ('Bob ' + ch.id)}</div>
            `;
            container.appendChild(card);
        });

        showView('viewChapters');
        updateBreadcrumb([currentBook.nameUz, 'Boblar']);
    }

    function filterHadithsByChapter(chapterId) {
        filteredHadiths = currentHadiths.filter(h => h.chapterId === chapterId);
        document.getElementById('selectedBookTitle').innerText = `${currentBook.nameUz} — Bob ${chapterId}`;
        document.getElementById('totalCount').innerText = `Ushbu bobda ${filteredHadiths.length} ta hadis bor`;

        displayedCount = 0;
        showView('viewHadiths');
        updateBreadcrumb([currentBook.nameUz, `Bob ${chapterId}`]);
        
        document.getElementById('hadithsList').innerHTML = '';
        loadMore();
    }

    function showAllHadithsOfBook() {
        filteredHadiths = currentHadiths;
        document.getElementById('selectedBookTitle').innerText = currentBook.nameUz;
        document.getElementById('totalCount').innerText = `Jami hadislar: ${currentHadiths.length} ta`;

        displayedCount = 0;
        showView('viewHadiths');
        updateBreadcrumb([currentBook.nameUz]);

        document.getElementById('hadithsList').innerHTML = '';
        loadMore();
    }

    function renderNextBatch(list) {
        const container = document.getElementById('hadithsList');

        list.forEach((item, index) => {
            const currentIndex = displayedCount - list.length + index;
            const card = document.createElement('div');
            card.className = 'hadith-card';
            
            const arabicText = item.arabic || '';
            const englishText = item.english?.text || (typeof item.english === 'string' ? item.english : '');
            const narrator = item.english?.narrator || '';

            card.innerHTML = `
                <div class="hadith-meta">
                    <span>Hadis #${item.bookHadithNo}</span>
                    <span>Bob: ${item.chapterId || 1}</span>
                </div>
                ${arabicText ? `<div class="hadith-ar">${arabicText}</div>` : ''}
                <div class="hadith-en">
                    ${narrator ? `<div class="narrator">${narrator}</div>` : ''}
                    <div>${englishText}</div>
                </div>
                <div class="hadith-actions">
                    <button class="action-btn" onclick="copyFormattedHadith(${currentIndex})">📋 Nusxalash</button>
                    <button class="action-btn" onclick="shareHadith(${currentIndex})">🔗 Bo'lishish</button>
                </div>
            `;
            container.appendChild(card);
        });

        const loadBtn = document.getElementById('loadMoreBtn');
        if (displayedCount < filteredHadiths.length) {
            loadBtn.classList.remove('hidden');
        } else {
            loadBtn.classList.add('hidden');
        }
    }

    function loadMore() {
        const nextBatch = filteredHadiths.slice(displayedCount, displayedCount + PAGE_SIZE);
        displayedCount += nextBatch.length;
        renderNextBatch(nextBatch);
    }

    function buildFormattedTextByIndex(index) {
        const item = filteredHadiths[index];
        if (!item) return '';

        const arabic = item.arabic || '';
        const english = item.english?.text || (typeof item.english === 'string' ? item.english : '');
        const narrator = item.english?.narrator ? item.english.narrator + '\n' : '';

        return `${SITE_URL} - Hadislar\n\n${arabic}\n\n${narrator}${english}\n\nManba: ${currentBook ? currentBook.author : ''}, ${currentBook ? currentBook.nameUz : ''}, Bob ${item.chapterId || 1}, Hadis ${item.bookHadithNo}.`;
    }

    function copyFormattedHadith(index) {
        const fullText = buildFormattedTextByIndex(index);
        if (!fullText) {
            alert("Hadis matni topilmadi!");
            return;
        }

        navigator.clipboard.writeText(fullText).then(() => {
            alert("Hadis matni va manbasi nusxalandi!");
        }).catch(err => {
            console.error("Nusxalashda xatolik:", err);
        });
    }

    async function shareHadith(index) {
        const item = filteredHadiths[index];
        const fullText = buildFormattedTextByIndex(index);

        if (!fullText) {
            alert("Bo'lishish uchun hadis matni topilmadi!");
            return;
        }

        const shareData = {
            title: `${currentBook?.nameUz || 'Hadis'} — #${item?.bookHadithNo}`,
            text: fullText
        };

        if (SITE_URL && SITE_URL.startsWith('http')) {
            shareData.url = SITE_URL;
        }

        if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
            try {
                await navigator.share(shareData);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error("Ulashishda xatolik:", err);
                    copyFormattedHadith(index);
                }
            }
        } else {
            copyFormattedHadith(index);
        }
    }

    function filterHadiths() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        document.getElementById('hadithsList').innerHTML = '';
        displayedCount = 0;

        if (!query) {
            filteredHadiths = currentHadiths;
        } else {
            filteredHadiths = currentHadiths.filter(item => {
                const ar = (item.arabic || '').toLowerCase();
                const en = (item.english?.text || '').toLowerCase();
                const num = String(item.bookHadithNo);
                return ar.includes(query) || en.includes(query) || num === query;
            });
        }

        document.getElementById('totalCount').innerText = `Topildi: ${filteredHadiths.length} ta hadis`;
        loadMore();
    }

    function showView(viewId) {
        document.getElementById('viewBooks').classList.add('hidden');
        document.getElementById('viewChapters').classList.add('hidden');
        document.getElementById('viewHadiths').classList.add('hidden');
        document.getElementById(viewId).classList.remove('hidden');
        window.scrollTo(0,0);
    }

    function goHome() {
        showView('viewBooks');
        updateBreadcrumb([]);
        document.getElementById('searchInput').value = '';
    }

    function updateBreadcrumb(paths) {
        const bc = document.getElementById('breadcrumb');
        if (paths.length === 0) {
            bc.innerHTML = '<span onclick="goHome()">Bosh sahifa</span>';
        } else {
            let html = '<span onclick="goHome()">Bosh sahifa</span>';
            paths.forEach(p => {
                html += ` / <span>${p}</span>`;
            });
            bc.innerHTML = html;
        }
    }

    function showLoading(show) {
        document.getElementById('loading').classList.toggle('hidden', !show);
    }

    init();
</script>

</body>
</html>
